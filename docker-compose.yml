# PRODUCTION stack (demo with sample data and a fake device: docker-compose.demo.yml).
#
#     copy .env.example to .env and fill in every value (nothing secret has a default here)
#     docker compose up -d --build
#
# AI weights are not in the image: put them in ./models (docs/runbook.md) and set AI_MODEL=cardiophon in .env.
# Without them the server logs it and runs the dummy analyzer.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # Loopback only (local development / backups); never reachable from the network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      RECORDINGS_DIR: /app/storage/recordings
      AI_MODEL_DIR: /app/models
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:?set FIRST_ADMIN_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./models:/app/models:ro
      - recordings:/app/storage/recordings

volumes:
  pgdata:
  recordings:

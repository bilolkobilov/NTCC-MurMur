[project]
name = "murmur-backend"
version = "0.1.0"
description = "MurMur heart-sound screening backend"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "fastapi>=0.162.2",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

# The real AI model (docs/specs/2026-11-08-ai-model.md). Optional: without it the server uses the dummy analyzer.
# Installed by default (see default-groups); `uv sync --no-group ai` for a server without AI. CPU-only PyTorch.
ai = [
    "numpy>=2.3",
    "torch>=2.15.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
package = false
# The demo laptop runs the real AI (owner, 2026-11-08): a plain `uv sync` must not remove PyTorch.
default-groups = ["dev", "ai"]
# Windows Smart App Control blocks SQLAlchemy's compiled (Cython) DLLs, so we build it as pure Python.
no-binary-package = ["sqlalchemy"]

[tool.uv.extra-build-variables]
sqlalchemy = { DISABLE_SQLALCHEMY_CEXT = "1" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# A SQLAlchemy warning usually means a real bug (e.g. a stale object in a test) — fail on it.
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.ruff]
line-length = 120
extend-include = ["../scripts/*.py"]

[tool.ruff.lint]
# E/F: errors and unused code, I: import order, B: likely bugs, UP: modern Python syntax
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]  # autogenerated

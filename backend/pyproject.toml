[project]
name = "murmur-backend"
version = "0.1.0"
description = "MurMur heart-sound screening backend"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "fastapi>=0.162.2",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

[tool.uv]
package = false
# Windows Smart App Control blocks SQLAlchemy's compiled (Cython) DLLs, so we build it as pure Python.
no-binary-package = ["sqlalchemy"]

[tool.uv.extra-build-variables]
sqlalchemy = { DISABLE_SQLALCHEMY_CEXT = "1" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
